<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMed - Menu Principal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f6f0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 30px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(124, 74, 46, 0.1); border-top: 5px solid #7C4A2E; }
        
        .user-bar { display: flex; justify-content: space-between; align-items: center; background: #222; color: white; padding: 12px 20px; border-radius: 6px; margin-bottom: 25px; font-size: 14px; }
        .user-bar a { background: #e74c3c; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        
        .logo-header { text-align: center; margin-bottom: 20px; }
        .logo-header img { max-width: 100px; height: auto; margin-bottom: 10px; }
        h1 { color: #7C4A2E; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .menu-card { background: #fdfcfa; border: 1px solid #e6dec5; padding: 25px; border-radius: 8px; text-align: center; text-decoration: none; color: #333; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; }
        .menu-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(124, 74, 46, 0.15); background: #fff; border-color: #7C4A2E; }
        .menu-card h3 { color: #7C4A2E; margin-bottom: 10px; }
        .menu-card p { font-size: 14px; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <div class="user-bar">
            <div><span>👤 <strong>{{ usuario_nome }}</strong> (<em>{{ usuario_perfil }}</em>)</span></div>
            <div><a href="/logout">Sair</a></div>
        </div>

        <div class="logo-header">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="StockMed Logo">
            <h1>StockMed</h1>
            <p class="subtitle">Sistema Inteligente de Controle Farmacêutico</p>
        </div>

        <div class="menu-grid">
            <a href="/medicamento/novo" class="menu-card">
                <h3>📦 Cadastrar Produto</h3>
                <p>Adicionar novos lotes e medicamentos ao stock geral.</p>
            </a>
            <a href="/estoque" class="menu-card">
                <h3>📊 Consultar Stock</h3>
                <p>Visualizar lista completa, aplicar filtros e gerenciar itens.</p>
            </a>
        </div>
    </div>

</body>
</html>
