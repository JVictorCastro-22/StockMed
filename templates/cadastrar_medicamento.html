<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMed - Cadastrar Medicamento</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 20px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #2c3e50; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #34495e; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cadastrar Novo Medicamento</h2>
        <form action="/medicamento/novo" method="POST">
            <div class="form-group">
                <label>Código de Barras:</label>
                <input type="text" name="codigo_barras" required>
            </div>
            <div class="form-group">
                <label>Nome do Medicamento:</label>
                <input type="text" name="nome" required>
            </div>
            <div class="form-group">
                <label>Descrição:</label>
                <input type="text" name="descricao" required>
            </div>
            <div class="form-group">
                <label>Lote:</label>
                <input type="text" name="lote" required>
            </div>
            <div class="form-group">
                <label>Quantidade Atual:</label>
                <input type="number" name="quantidade_atual" required>
            </div>
            <div class="form-group">
                <label>Validade:</label>
                <input type="date" name="validade" required>
            </div>
            <div class="form-group">
                <label>Laboratório:</label>
                <input type="text" name="laboratorio" required>
            </div>
            <button type="submit">Salvar Medicamento</button>
        </form>
        <a href="/" class="back-link">← Voltar ao Menu Principal</a>
    </div>

</body>
</html>
